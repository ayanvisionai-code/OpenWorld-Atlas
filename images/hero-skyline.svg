<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0b3d"/>
      <stop offset=".38" stop-color="#6b1f7a"/>
      <stop offset=".62" stop-color="#c8337f"/>
      <stop offset=".8" stop-color="#ff7a4d"/>
      <stop offset="1" stop-color="#ffb35c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1055"/>
      <stop offset="1" stop-color="#120a2b"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe97a"/>
      <stop offset="1" stop-color="#ff5e8a"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170a33"/>
      <stop offset="1" stop-color="#2a1246"/>
